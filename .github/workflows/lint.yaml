name: Lint & Format Check

on: [pull_request, push]

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install clang-format
        run: |
          python -m pip install -r scripts/requirements-dev.txt
          clang-format --version

      - name: Check C/C++ formatting
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA=$(git merge-base "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}")
          fi
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${BASE_SHA}" "${GITHUB_SHA}" -- include src tests |
              grep -zE '\.(c|cpp|h|hpp)$' || true
          )
          if ((${#files[@]})); then
            printf 'Checking %s\n' "${files[@]}"
            clang-format --dry-run --Werror "${files[@]}"
          else
            echo "No changed C/C++ files"
          fi
